[PHP]
; Memory
memory_limit = 256M

; Upload
upload_max_filesize = 100M
post_max_size = 100M

; Execution
max_execution_time = 120
max_input_time = 60

; Error handling
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Timezone
date.timezone = America/Sao_Paulo

; Session
session.save_handler = redis
session.save_path = "tcp://redis:6379"

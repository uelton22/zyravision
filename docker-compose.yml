services:
  # ─── Laravel PHP-FPM ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: zyravision-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - videodata:/recordings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - streaming
    environment:
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1

  # ─── Nginx Web Server (Escalavel) ────────────────────────────
  # Proxy HTTP + HLS + WebRTC. Stateless — facil de escalar.
  # Escale via: WEB_REPLICAS=N no .env
  # NOTA: Para WEB_REPLICAS > 1, remova o container_name e configure
  #       um load balancer (traefik/haproxy) na frente.
  web:
    image: nginx:alpine
    container_name: zyravision-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - frontend
      - streaming
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 64M

  # ─── PostgreSQL 15 ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: zyravision-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE:-zyravision}
      POSTGRES_USER: ${DB_USERNAME:-zyravision}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-zyravision}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zyravision-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Laravel Queue Worker (Horizon) — Escalavel ──────────────
  # Processa jobs das filas: default, recordings, transcoding, notifications.
  # Escale via: QUEUE_REPLICAS=N no .env
  # Cada replica roda uma instancia do Horizon com seus supervisors.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www/html
      - videodata:/recordings
    depends_on:
      - app
      - redis
    networks:
      - backend
      - streaming
    deploy:
      replicas: ${QUEUE_REPLICAS:-1}
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ─── Laravel Scheduler ───────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: zyravision-scheduler
    restart: unless-stopped
    user: root
    command: >
      sh -c "while true; do
        chmod -R 777 /recordings 2>/dev/null;
        php /var/www/html/artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    volumes:
      - .:/var/www/html
      - videodata:/recordings
    depends_on:
      - app
    networks:
      - backend

  # ─── Vite Dev Server (Development only) ──────────────────────
  node:
    image: node:20-alpine
    container_name: zyravision-node
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - nodemodules:/var/www/html/node_modules
    networks:
      - frontend

  # ─── Laravel Reverb (WebSocket Server) ───────────────────────
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: zyravision-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    ports:
      - "${REVERB_PORT:-6001}:6001"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - frontend
      - backend

  # ─── FFmpeg Transcoder Worker (Escalavel) ─────────────────────
  # Container dedicado para transcodificacao de video.
  # Cada worker pode gerenciar ate FFMPEG_MAX_CONCURRENT cameras simultaneas.
  # Escale via: TRANSCODER_REPLICAS=N no .env
  # Para desativar (cameras usam MediaMTX nativo): TRANSCODER_REPLICAS=0
  transcoder:
    build:
      context: .
      dockerfile: docker/transcoder/Dockerfile
    restart: unless-stopped
    command: php artisan transcoder:worker --max-cameras=${FFMPEG_MAX_CONCURRENT:-10} --poll-interval=2 -v
    volumes:
      - .:/var/www/html
      - videodata:/recordings
    depends_on:
      - redis
      - mediamtx
    networks:
      - backend
      - streaming
    environment:
      - FFMPEG_MAX_CONCURRENT=${FFMPEG_MAX_CONCURRENT:-10}
      - FFMPEG_H264_PRESET=${FFMPEG_H264_PRESET:-fast}
      - FFMPEG_LOG_LEVEL=${FFMPEG_LOG_LEVEL:-warning}
    deploy:
      replicas: ${TRANSCODER_REPLICAS:-1}
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ─── MediaMTX (Streaming Server) ─────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: zyravision-mediamtx
    restart: unless-stopped
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${MEDIAMTX_HLS_PORT:-8888}:8888"
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_API_PORT:-9997}:9997"
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml
      - videodata:/recordings
    networks:
      - backend
      - streaming
    healthcheck:
      test: ["NONE"]

  # ─── MeiliSearch ─────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: zyravision-meilisearch
    restart: unless-stopped
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meilisearchdata:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
      MEILI_NO_ANALYTICS: true
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  nodemodules:
    driver: local
  meilisearchdata:
    driver: local
  videodata:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  streaming:
    driver: bridge
